[PHP]
extension_dir = "ext"
extension=gettext
extension=mbstring
extension=fileinfo
date.timezone = UTC
memory_limit = 512M
max_execution_time = 0
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 501
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
variables_order = "EGPCS"
session.cookie_samesite = "Lax"
