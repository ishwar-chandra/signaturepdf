name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install build dependencies
        run: npm ci

      - name: Set installer version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to determine version from tag ${{ github.ref_name }}"
          }
          npm version $version --no-git-tag-version --allow-same-version

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter *.exe | Where-Object { -not $_.PSIsContainer })
          if ($installers.Count -eq 0) {
            throw 'No Windows installer was generated'
          }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Out-File -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem -Path dist -Filter *.exe
          Get-ChildItem -Path dist -Filter *.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: signaturepdf-windows-installer
          path: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Signature PDF ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
